seed: 0
num_steps_per_env: 20
max_iterations: 10000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 1000
experiment_name: gr3mini_adapter_Extended_3_stageii
run_name: adapter_8gpu_4096env_Extended_3_stageii
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
upload_model: false
class_name: AdapterOnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 512
  - 256
  - 256
  - 128
  activation: swish
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg:
    class_name: gr3mini_tracking.adapter.distribution:TanhGaussianDistribution
    min_std: 0.001
    max_std: 1.0
    var_scale: 1.0
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: gr3mini_tracking.adapter.models:ResidualAdapterActor
critic:
  hidden_dims: !!python/tuple
  - 512
  - 512
  - 256
  - 256
  - 128
  activation: swish
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: gr3mini_tracking.adapter.models:AdapterCritic
algorithm:
  num_learning_epochs: 4
  num_mini_batches: 32
  learning_rate: 0.0001
  schedule: fixed
  gamma: 0.97
  lam: 0.95
  entropy_coef: 0.0001
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  class_name: gr3mini_tracking.adapter.algorithm:AdapterPPO
teacher_checkpoint: /my_projects/gr3mini_tracking/logs/rsl_rl/gr3mini_teacher_dynamic_l1_2/2026-08-17_01-35-32_teacher_8gpu_32768env_10000iters/model_9000.pt
world_model_learning_rate: 0.0001
world_model_num_mini_batches: 32
